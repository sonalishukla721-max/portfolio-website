<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | Sonali Portfolio</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="auth-container">

        <div class="auth-box">

            <h1>Create Account</h1>

            <p>Create your portfolio dashboard account.</p>

            <form id="registerForm">

                <input
                    type="text"
                    id="registerName"
                    placeholder="Name"
                    required
                >

                <input
                    type="email"
                    id="registerEmail"
                    placeholder="Email"
                    required
                >

                <input
                    type="password"
                    id="registerPassword"
                    placeholder="Password"
                    required
                >

                <button type="submit">
                    Register
                </button>

            </form>

            <p id="registerMessage"></p>

            <p>
                Already have an account?
                <a href="login.html">Login</a>
            </p>

            <p>
                <a href="index.html">← Back to Portfolio</a>
            </p>

        </div>

    </div>

    <script src="auth.js"></script>

</body>
</html>
