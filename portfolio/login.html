<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Admin login for Sonali Shukla's portfolio."
    >

    <title>Admin Login | Sonali Shukla</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <a class="skip-link" href="#main-content">
        Skip to content
    </a>

    <!-- Header -->

    <header class="site-header">

        <nav class="navbar container" aria-label="Primary navigation">

            <a class="brand" href="index.html">
                Sonali<span> Shukla</span>
            </a>

            <div class="nav-menu">

                <a class="nav-link" href="index.html">
                    Portfolio
                </a>

            </div>

        </nav>

    </header>


    <!-- Admin Login -->

    <main id="main-content">

        <section class="admin-login-section">

            <div class="admin-login-card">

                <p class="section-label">
                    ADMIN AREA
                </p>

                <h1>
                    Welcome Back
                </h1>

                <p class="admin-login-intro">
                    Sign in to manage your portfolio content.
                </p>


                <form id="loginForm">

                    <div class="admin-form-field">

                        <label for="loginEmail">
                            Email
                        </label>

                        <input
                            type="email"
                            id="loginEmail"
                            name="email"
                            placeholder="Enter your email"
                            autocomplete="email"
                            required
                        >

                    </div>


                    <div class="admin-form-field">

                        <label for="loginPassword">
                            Password
                        </label>

                        <input
                            type="password"
                            id="loginPassword"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                    </div>


                    <button
                        class="button button-primary admin-login-button"
                        type="submit"
                    >
                        Sign In
                        <span aria-hidden="true">→</span>
                    </button>

                </form>


                <p
                    id="loginMessage"
                    class="admin-login-message"
                    role="status"
                    aria-live="polite"
                ></p>


                <p>
               <a href="index.html">← Back to Portfolio</a>
              </p>
            </div>

        </section>

    </main>


    <script src="auth.js"></script>

</body>

</html>
